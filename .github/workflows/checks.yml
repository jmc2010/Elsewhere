name: checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  google-data-retention:
    name: Google Places data-retention guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Assert no Google Places content is persisted
        run: python3 scripts/check-no-google-persistence.py

  colour-literals:
    name: Colour literal guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Assert every colour goes through the theme
        run: python3 scripts/check-no-colour-literals.py

  edge-functions:
    name: Edge function typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Typecheck
        # --config explicitly: Deno discovers config from the working
        # directory, and there is deliberately no deno.json at the repo root
        # (that would be the Expo app's territory). Without this the root
        # package.json wins and the check looks for a node_modules this job
        # has no reason to install.
        run: deno check --config supabase/functions/deno.json supabase/functions/**/*.ts

  app:
    name: App typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
